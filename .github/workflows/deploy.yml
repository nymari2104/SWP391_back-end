name: Build & Deploy to Cloud Run

on:
  push:
    branches:
      - test-API

# Biến môi trường dùng chung cho cả job, giúp dễ dàng quản lý và thay đổi
env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  REPOSITORY: trouni-repo
  SERVICE_NAME: spring-boot-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Build & Push image with Jib
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE=asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/trouni-repo/spring-boot-app:${{ github.sha }}
          mvn -B -DskipTests package jib:build -Dimage=$IMAGE

      - name: Deploy to Cloud Run
        run: |
          IMAGE=asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/trouni-repo/spring-boot-app:${{ github.sha }}
          gcloud run deploy spring-boot-app \
            --image=$IMAGE \
            --platform=managed \
            --region=${{ secrets.REGION }} \
            --allow-unauthenticated \
            --set-env-vars="SPRING_DATASOURCE_URL=${{ secrets.IP }},SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USERNAME }},SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}"