name: Build & Deploy to Cloud Run

on:
  push:
    branches:
      - test-API   # thay bằng tên branch bạn muốn deploy (ảnh của bạn default branch là test-API)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Create application.properties
        run: |
          echo "spring.datasource.url=jdbc:postgresql://${{ secrets.IP }}/trouni" >> SWP391_back-end/src/main/resources/application.properties
          echo "spring.datasource.username=${{ secrets.DB_USERNAME }}" >> SWP391_back-end/src/main/resources/application.properties
          echo "spring.datasource.password=${{ secrets.DB_PASSWORD }}" >> SWP391_back-end/src/main/resources/application.properties

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Build & Push image with Jib
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE=asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/spring-boot-app:${{ github.sha }}
          mvn -B -DskipTests package jib:build -Dimage=$IMAGE

      - name: Deploy to Cloud Run
        run: |
          IMAGE=asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/spring-boot-app:${{ github.sha }}
          gcloud run deploy spring-boot-app \
            --image=$IMAGE \
            --platform=managed \
            --region=${{ secrets.GCP_REGION }} \
            --allow-unauthenticated
